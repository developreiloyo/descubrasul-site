# Override para desenvolvimento local.
# Este arquivo é carregado automaticamente pelo Docker Compose em dev.
# NÃO usar em produção — em prod usar apenas docker-compose.yml.
services:
  backend:
    ports:
      - "8000:8000"   # expõe para acesso direto em desenvolvimento

  frontend:
    ports:
      - "3000:3000"

  db:
    ports:
      - "5433:5432"   # expõe PostgreSQL para acesso pelo MCP GMC local (tools/gmc-mcp) — 5433 evita conflito com PostgreSQL do sistema
